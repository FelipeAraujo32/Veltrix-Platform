server:
  port: ${AUTH_SERVER_PORT:8082}
  # Fail-closed: the auth-service does NOT honor X-Forwarded-* (no strategy set == none).
  # Rationale: it has no consumer of scheme/host/remoteAddr today (no absolute-URL builder, no
  # password-reset/verification link, and cookie Secure is config-driven via security.cookies.secure,
  # not derived from the request scheme). Enabling `framework` would activate Spring's
  # ForwardedHeaderFilter, and X-Forwarded-Host is NOT filtered by the gateway's trusted-proxies
  # (only X-Forwarded-For is IP-filtered; XFH from the client survives nginx->gateway->auth as the
  # leftmost value the servlet filter reads) — a dormant host-header-injection primitive. Turn this
  # to `framework` ONLY together with (a) a real consumer and (b) gateway-side stripping/canonicalization
  # of X-Forwarded-Host and the RFC 7239 Forwarded header.

spring:
  config:
    import:
      - optional:file:.env[.properties]
  application:
    name: auth-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: security
    open-in-view: false
  flyway:
    locations: classpath:db/migration
    default-schema: security
    schemas: security
  data:
    redis:
      url: ${AUTH_REDIS_URL:redis://localhost:6379}
      # Timeouts curtos: Redis LENTO vira o fail-open declarado do lockout (sem throttle) em vez de
      # adicionar latência a todo login / exaurir threads do pool HTTP.
      timeout: ${AUTH_REDIS_TIMEOUT:300ms}
      connect-timeout: ${AUTH_REDIS_CONNECT_TIMEOUT:500ms}

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  private-key-path: ${JWT_PRIVATE_KEY_PATH}
  key-id: ${JWT_KEY_ID}
  issuer: ${JWT_ISSUER}
  audience: ${JWT_AUDIENCE}
  access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
  refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:2592000}

security:
  cookies:
    secure: ${AUTH_COOKIE_SECURE:true}
  allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}
  # OBRIGATÓRIO na topologia atrás de gateway/LB: peers diretos confiáveis cujos headers de IP são
  # honrados para derivar o IP real do cliente — preferindo X-Veltrix-Client-Ip (injetado pelo gateway,
  # que sobrescreve qualquer valor vindo de fora; o SCG 5 com trusted-proxies FILTRA IPs públicos da
  # cadeia X-Forwarded-For repassada, então XFF sozinho não basta), com fallback para XFF. Aceita IP
  # exato ou CIDR (ex.: "172.18.0.0/16", subnet do Docker onde roda o gateway). SEM isso, o IP visto é
  # o do gateway para TODOS os clientes e a chave de lockout conta+IP colapsa para conta+constante —
  # um atacante trancaria a vítima com poucas falhas (DoS de conta barato). O limiar por conta
  # (account-max-attempts) só limita o dano.
  trusted-proxies: ${AUTH_TRUSTED_PROXIES:}
  # Lockout progressivo de login (fecha L4 na camada de serviço). Duas chaves independentes:
  # conta+IP (rápida, progressiva) e conta sozinha (limiar alto, bloqueio curto fixo — segura
  # brute-force distribuído sem permitir trancar a vítima barato).
  login-lockout:
    max-attempts: ${AUTH_LOCKOUT_MAX_ATTEMPTS:5}
    base-block: ${AUTH_LOCKOUT_BASE_BLOCK:1m}
    max-block: ${AUTH_LOCKOUT_MAX_BLOCK:15m}
    fail-window: ${AUTH_LOCKOUT_FAIL_WINDOW:15m}
    account-max-attempts: ${AUTH_LOCKOUT_ACCOUNT_MAX_ATTEMPTS:30}
    account-block: ${AUTH_LOCKOUT_ACCOUNT_BLOCK:5m}
    account-fail-window: ${AUTH_LOCKOUT_ACCOUNT_FAIL_WINDOW:10m}

auth:
  bootstrap:
    enabled: ${AUTH_BOOTSTRAP_ENABLED:false}
    email: ${AUTH_BOOTSTRAP_EMAIL:}
    # Em produção a senha NÃO chega por env var: o Docker secret auth_bootstrap_password
    # (configtree, target auth.bootstrap.password) sobrepõe este placeholder — o compose
    # não repassa AUTH_BOOTSTRAP_PASSWORD. A env var fica só como caminho de dev local.
    password: ${AUTH_BOOTSTRAP_PASSWORD:}
    name: ${AUTH_BOOTSTRAP_NAME:Administrador}

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId}]"
